<dialog
      id="contact-dialog"
      class="contact-dialog"
      aria-labelledby="contact-dialog-title"
      aria-describedby="contact-dialog-description"
    >
      <button
        type="button"
        class="contact-dialog-close"
        data-contact-close
        aria-label="بستن پنجره تماس"
        autofocus
      >
        ×
      </button>
      <h2 id="contact-dialog-title">بیایید صحبت کنیم</h2>
      <p id="contact-dialog-description">
        راه ارتباطی راحت‌تر را انتخاب کنید؛ بدون فرم و معطلی.
      </p>
      <div class="contact-dialog-options">
        <a class="contact-dialog-option" href="tel:+989999685110">
          <strong>تماس مستقیم</strong>
          <small dir="ltr">0999 968 5110</small>
        </a>
        <a
          class="contact-dialog-option"
          href="mailto:hello@hallboard.ir"
        >
          <strong>ارسال ایمیل</strong>
          <small dir="ltr">hello@hallboard.ir</small>
        </a>
      </div>
    </dialog>
