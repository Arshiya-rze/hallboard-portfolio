<header class="header">
        <a
          class="brand"
          href="#hero"
          aria-label="هالبورد؛ بازگشت به ابتدای صفحه"
        >
          <span class="brand-reveal" aria-hidden="true">
            <img class="brand-mark" ngSrc="assets/brand/logo-crystal.webp" width="32" height="36" alt="" priority />
            <span class="brand-wordmark"></span>
          </span>
        </a>

        <input
          type="checkbox"
          id="menu-toggle"
          class="menu-toggle"
          tabindex="-1"
          [checked]="menuOpen()"
          (change)="toggleMenu($event)"
        />

        <label
          for="menu-toggle"
          class="hamburger"
          role="button"
          tabindex="0"
          aria-label="باز کردن منوی اصلی"
          aria-controls="primary-nav"
          [attr.aria-expanded]="menuOpen()"
          [attr.aria-label]="menuOpen() ? 'بستن منوی اصلی' : 'باز کردن منوی اصلی'"
        >
          <span></span>
          <span></span>
          <span></span>
        </label>

        <nav class="nav" id="primary-nav" aria-label="منوی اصلی">
          <a href="#team" (click)="closeMenu()">تیم ما</a>
          <a href="#projects" (click)="closeMenu()">نمونه‌کارها</a>
          <a href="#what-we-do" (click)="closeMenu()">خدمات ما</a>
          <a href="#how-we-work" (click)="closeMenu()">روش کار ما</a>
        </nav>

        <button
          class="theme-toggle"
          type="button"
          (click)="theme.toggle()"
          [attr.aria-pressed]="theme.isLight()"
          [attr.aria-label]="theme.isLight() ? 'فعال‌کردن تم تیره' : 'فعال‌کردن تم روشن'"
          [attr.title]="theme.isLight() ? 'تم تیره' : 'تم روشن'"
        >
          @if (theme.isLight()) {
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path d="M20.3 15.4A8.5 8.5 0 0 1 8.6 3.7 8.5 8.5 0 1 0 20.3 15.4Z" />
            </svg>
          } @else {
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
            </svg>
          }
        </button>

        <a
          class="btn btn-primary header-btn"
          href="#contact-dialog"
          data-contact-open
        >
          شروع همکاری
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M17 7 7 17M7 7h10v10" />
          </svg>
        </a>
      </header>
